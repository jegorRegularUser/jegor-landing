<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Егор Двойняков — frontend-разработчик: React, TypeScript, three.js. Проекты, опыт, контакты." />
    <meta name="theme-color" content="#0A1E33" />
    <meta name="google-site-verification" content="pLcDBdMRV__hmanyj5WU2sDqV3ROsWH_8li6-Ksuxwc" />
    <title>Егор Двойняков — Frontend-разработчик</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jegor-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
          var l = localStorage.getItem('jegor-lang')
            || ((navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'ru');
          document.documentElement.lang = l;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.lang = 'ru';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Neucha&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
